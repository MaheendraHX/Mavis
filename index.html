<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Mavis is temporarily offline while being rebuilt."
  />

  <title>Mavis — Temporarily Offline</title>

  <style>
    :root {
      --ink: #151515;
      --muted: #777;
      --line: #e8e8e8;
      --soft: #f7f7f5;
      --accent: #b58a4a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #fff;
      color: var(--ink);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100%, 760px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: none;
    }

    .mark {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }

    .content {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 42px;
      padding: 92px 0 84px;
    }

    .number {
      color: #c9c9c9;
      font-family: Georgia, serif;
      font-size: 20px;
      line-height: 1;
    }

    .eyebrow {
      margin: 4px 0 24px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 560px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.5rem, 9vw, 7.4rem);
      font-weight: 400;
      letter-spacing: -0.065em;
      line-height: 0.88;
    }

    .description {
      max-width: 430px;
      margin: 32px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 34px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: #555;
      font-size: 12px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    a {
      color: var(--ink);
      text-decoration-color: #cfcfcf;
      text-underline-offset: 4px;
      transition:
        color 160ms ease,
        text-decoration-color 160ms ease;
    }

    a:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    @media (max-width: 620px) {
      body {
        padding: 24px;
      }

      .content {
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 70px 0 64px;
      }

      .number {
        font-size: 16px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="mark"></span>
        Mavis
      </div>

      <span>Temporarily offline</span>
    </header>

    <section class="content" aria-labelledby="page-title">
      <div class="number">01 / 01</div>

      <div>
        <p class="eyebrow">Project status</p>

        <h1 id="page-title">
          A brief  

          pause.
        </h1>

        <p class="description">
          Mavis is currently offline while the next version is being rebuilt
          and refined. She’ll be back when the work is ready.
        </p>

        <div class="status">
          <span class="status-dot"></span>
          Being rebuilt
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>MAVIS / 2026</span>
      <a href="https://github.com/MaheendraHX">
        Back to GitHub
      </a>
    </footer>
  </main>
</body>
</html>
