name: Verify Mavis

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend sources
        run: python -m compileall -q api.py memory.py usage_store.py test_mavis_core.py test_deployment_smoke.py
      - name: Run provider, quota, and access tests
        run: python test_mavis_core.py && python test_deployment_smoke.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint active Mavis chat files
        run: npx eslint src/routes/chat.tsx src/components/chat/ChatSidebar.tsx src/components/chat/Composer.tsx src/components/chat/MessageItem.tsx
      - name: Build production frontend
        run: npm run build
