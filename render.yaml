services:
  - type: web
    runtime: python
    name: aria-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Gemini is Mavis's primary provider. Groq is retained for transient or rate-limit fallback.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: MODEL_PROVIDER
        value: "gemini"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "groq/compound-mini"
      - key: GROQ_BACKUP_MODEL
        value: "groq/compound-mini"
      - key: ALLOWED_ORIGINS
        sync: false
      # Set this to a Render Postgres internal connection URL for durable public-demo quotas.
      - key: DATABASE_URL
        sync: false
      - key: GUEST_MESSAGE_LIMIT
        value: "10"
      - key: PUBLIC_REQUESTS_PER_MINUTE
        value: "12"
      - key: PC_CONTROL_ENABLED
        value: "false"
      - key: SERPER_API_KEY
        sync: false
      - key: OWNER_PASSKEY
        sync: false
      - key: OWNER_SESSION_TTL_SECONDS
        value: "43200"
      - key: SESSION_SECRET
        generateValue: true
