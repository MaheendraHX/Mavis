services:
  - type: web
    runtime: python
    name: aria-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Render requires a fully qualified version when set as an environment variable.
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PC_CONTROL_ENABLED
        value: "false"
      - key: SERPER_API_KEY
        sync: false
      - key: OWNER_PASSKEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
